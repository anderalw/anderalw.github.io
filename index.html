<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FF9009" />

    <title>Pontual</title>

    <!-- Modo claro ou escuro antes de o app carregar (sem piscar o escuro).
         A escolha é salva por src/hooks/Theme.tsx -->
    <script>
      (function () {
        try {
          var choice = localStorage.getItem('@GoBarber:theme');
          var light =
            choice === 'light' ||
            (choice === 'system' &&
              window.matchMedia('(prefers-color-scheme: light)').matches);
          document.documentElement.dataset.theme = light ? 'light' : 'dark';
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  </head>
  <body>
    <noscript>Ative o JavaScript para usar o Pontual.</noscript>
    <div id="root"></div>

    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
